<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23123A68%27/%3E%3Crect x=%276%27 y=%277%27 width=%279%27 height=%279%27 rx=%272%27 fill=%27%23E3A23C%27/%3E%3Crect x=%2717%27 y=%277%27 width=%279%27 height=%279%27 rx=%272%27 fill=%27%234BC4E6%27/%3E%3Crect x=%276%27 y=%2718%27 width=%279%27 height=%277%27 rx=%272%27 fill=%27%239B8CFA%27/%3E%3Crect x=%2717%27 y=%2718%27 width=%279%27 height=%277%27 rx=%272%27 fill=%27%234ED2A3%27/%3E%3C/svg%3E">
<title>Quiz · BSC na Governança de TI</title>
<meta name="theme-color" content="#123A68">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#FFF; --paper-2:#F6F9FC; --ink:#0C1622; --ink-2:#33445C; --muted:#64768F; --faint:#9AAABF;
  --line:#D7E1EE; --navy:#123A68; --gold:#A96A06; --blue:#0A6FA6; --violet:#5739C4; --green:#077A51; --red:#B92F35;
  --display:'Newsreader',Georgia,serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  --gut:max(18px,env(safe-area-inset-left,0px));
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-optical-sizing:auto}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;line-height:1.14;letter-spacing:-.012em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px;border-radius:8px}
.wrap{min-height:100%;display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) var(--gut) calc(16px + env(safe-area-inset-bottom,0px)) var(--gut)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--display);font-size:17px;font-weight:700;color:var(--navy)}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pont{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--navy);
  font-variant-numeric:tabular-nums;white-space:nowrap}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:22px 0}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
.big{font-size:clamp(23px,6.5vw,34px)}
.sub{color:var(--ink-2);font-size:16px}
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px}
input{width:100%;font:inherit;padding:15px 16px;border:2px solid var(--line);border-radius:12px;
  background:var(--paper-2);color:var(--ink)}
input:focus{border-color:var(--navy);outline:none;background:var(--paper)}
.cta{width:100%;background:var(--navy);color:#fff;font-weight:600;font-size:17px;
  padding:16px;border-radius:12px;margin-top:14px;transition:.15s}
.cta:active{transform:scale(.985)}
.cta[disabled]{opacity:.45;cursor:default}
.opts{display:grid;gap:11px}
.op{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;
  padding:17px 17px;border-radius:14px;color:#fff;font-weight:500;font-size:16.5px;line-height:1.3;
  transition:.15s;min-height:72px}
.op:active{transform:scale(.985)}
.op .n{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.22);font-family:var(--mono);font-size:13px;font-weight:600}
.op.a{background:var(--gold)} .op.b{background:var(--blue)}
.op.c{background:var(--violet)} .op.d{background:var(--green)}
.op.off{opacity:.3}
.op.sel{outline:4px solid var(--ink);outline-offset:3px}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:9px}
.card.ok{background:#E2F4EC;border-color:#AEE0CD}
.card.nao{background:#FCEAEA;border-color:#F1C4C5}
.card h3{font-size:20px}
.card p{font-size:15.5px;color:var(--ink-2)}
.ganho{font-family:var(--display);font-size:40px;font-weight:700;color:var(--green);line-height:1;
  font-variant-numeric:tabular-nums}
.rank{display:grid;gap:8px}
.lin{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;
  padding:12px 14px;border-radius:11px;background:var(--paper-2);border:1px solid var(--line)}
.lin.eu{border-color:var(--navy);background:#EAF1F8}
.lin .p{font-family:var(--display);font-size:19px;font-weight:700;color:var(--navy)}
.lin .nm{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lin .pt{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.lin:nth-child(1) .p{color:var(--gold)}
.aguardando{display:grid;gap:14px;justify-items:center;text-align:center;padding:26px 0}
.dots{display:flex;gap:7px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--navy);opacity:.25;animation:pulsa 1.4s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
@keyframes pulsa{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
.barra{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--navy);width:100%;transform-origin:left}
.aviso{font-family:var(--mono);font-size:12px;color:var(--faint);text-align:center;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand"><b>BSC</b><span>Governança de TI · 2026.2</span></span>
    <span class="pont" id="pont"></span>
  </header>
  <main id="tela"></main>
  <p class="aviso" id="rodape"></p>
</div>

<script type="module">
import { QUESTOES, LIMITE_MS, pontos } from './quiz-data.js';
import { conectar, configurado, meuId } from './sala.js';

const tela = document.getElementById('tela');
const pontEl = document.getElementById('pont');
const rodape = document.getElementById('rodape');
const id = meuId();
let sala = new URLSearchParams(location.search).get('sala');
let fb = null, nome = '', meusPontos = 0, respondida = -1, abertaEm = 0, jogadores = {};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render(html) { tela.innerHTML = html; }

if (!configurado()) {
  render(`<p class="eyebrow">Configuração pendente</p>
    <h1 class="big">O quiz ao vivo ainda não foi ligado</h1>
    <p class="sub">Quem montou o site precisa preencher o arquivo <code>config.js</code> com os dados do Firebase. As instruções estão no README do projeto.</p>`);
} else if (!sala) {
  pedirSala();
} else {
  entrar();
}

function pedirSala() {
  render(`<p class="eyebrow">Entrar na sala</p>
    <h1 class="big">Digite o código da sala</h1>
    <p class="sub">O código de 4 letras está na tela do projetor.</p>
    <div><label for="cod">Código</label>
    <input id="cod" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD"
      style="text-transform:uppercase;font-family:var(--mono);font-size:26px;letter-spacing:.3em;text-align:center"></div>
    <button class="cta" id="ir">Continuar</button>`);
  const i = document.getElementById('cod');
  const go = () => { const v = i.value.trim().toUpperCase(); if (v.length === 4) { sala = v; entrar(); } };
  document.getElementById('ir').onclick = go;
  i.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  i.focus();
}

function pedirNome() {
  render(`<p class="eyebrow">Sala ${esc(sala)}</p>
    <h1 class="big">Como você quer aparecer no pódio?</h1>
    <p class="sub">Use seu nome real: a pontuação extra vale na nota de participação.</p>
    <div><label for="nm">Seu nome</label>
    <input id="nm" maxlength="28" autocomplete="name" placeholder="Nome e sobrenome"></div>
    <button class="cta" id="ok">Entrar no quiz</button>`);
  const i = document.getElementById('nm');
  const go = async () => {
    const v = i.value.trim();
    if (v.length < 2) { i.focus(); return; }
    nome = v;
    try { localStorage.setItem('bsc_nome', v); } catch (e) {}
    await fb.set(fb.ref(fb.db, `salas/${sala}/jogadores/${id}`), { nome: v, pontos: 0 });
    ouvir();
  };
  document.getElementById('ok').onclick = go;
  i.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  try { i.value = localStorage.getItem('bsc_nome') || ''; } catch (e) {}
  i.focus();
}

async function entrar() {
  render(`<div class="aguardando"><div class="dots"><i></i><i></i><i></i></div><p class="sub">Conectando…</p></div>`);
  try { fb = await conectar(); } catch (e) {
    render(`<p class="eyebrow">Erro</p><h1 class="big">Não consegui conectar</h1>
      <p class="sub">Verifique a configuração do Firebase em <code>config.js</code>.</p>`);
    return;
  }
  rodape.textContent = 'Sala ' + sala;
  const snap = await fb.get(fb.ref(fb.db, `salas/${sala}/jogadores/${id}`));
  if (snap.exists() && snap.val().nome) { nome = snap.val().nome; meusPontos = snap.val().pontos || 0; ouvir(); }
  else pedirNome();
}

function ouvir() {
  fb.onValue(fb.ref(fb.db, `salas/${sala}/jogadores`), (s) => {
    jogadores = s.val() || {};
    meusPontos = (jogadores[id] && jogadores[id].pontos) || 0;
    pontEl.textContent = meusPontos ? meusPontos + ' pts' : '';
  });
  fb.onValue(fb.ref(fb.db, `salas/${sala}/estado`), (s) => desenhar(s.val() || { fase: 'lobby' }));
}

function ordenado() {
  return Object.entries(jogadores)
    .map(([k, v]) => ({ id: k, nome: v.nome || '—', pontos: v.pontos || 0 }))
    .sort((a, b) => b.pontos - a.pontos || a.nome.localeCompare(b.nome));
}

function listaRank(lim) {
  const arr = ordenado();
  const eu = arr.findIndex((x) => x.id === id);
  const mostrar = arr.slice(0, lim);
  if (eu >= lim) mostrar.push(arr[eu]);
  return `<div class="rank">${mostrar.map((x) => {
    const pos = arr.findIndex((y) => y.id === x.id) + 1;
    return `<div class="lin ${x.id === id ? 'eu' : ''}"><span class="p">${pos}º</span>
      <span class="nm">${esc(x.nome)}</span><span class="pt">${x.pontos}</span></div>`;
  }).join('')}</div>`;
}

function desenhar(e) {
  if (e.fase === 'pergunta') return verPergunta(e);
  if (e.fase === 'revelar') return verResposta(e);
  if (e.fase === 'fim') return verFim();
  render(`<div class="aguardando"><p class="eyebrow">Sala ${esc(sala)}</p>
    <h1 class="big">Tudo pronto, ${esc(nome.split(' ')[0])}!</h1>
    <p class="sub">Aguarde a primeira pergunta aparecer no projetor.</p>
    <div class="dots"><i></i><i></i><i></i></div></div>`);
}

function verPergunta(e) {
  const q = QUESTOES[e.q];
  if (!q) return;
  abertaEm = e.abertaEm || Date.now();
  if (respondida === e.q) return jaRespondeu(e.q);
  render(`<div><p class="eyebrow">Questão ${e.q + 1} de ${QUESTOES.length}</p>
    <h1 class="big" style="margin-top:7px">${esc(q.t)}</h1></div>
    <div class="barra"><i id="tempo"></i></div>
    <div class="opts">${q.o.map((t, i) => `<button class="op ${'abcd'[i]}" data-i="${i}">
      <span class="n">${'ABCD'[i]}</span><span>${esc(t)}</span></button>`).join('')}</div>`);
  const barra = document.getElementById('tempo');
  const tick = () => {
    const f = Math.max(0, 1 - (Date.now() - abertaEm) / LIMITE_MS);
    if (barra) barra.style.transform = `scaleX(${f})`;
    if (f > 0 && respondida !== e.q) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  tela.querySelectorAll('.op').forEach((b) => {
    b.onclick = async () => {
      if (respondida === e.q) return;
      respondida = e.q;
      const op = Number(b.dataset.i);
      const ms = Math.max(0, Date.now() - abertaEm);
      tela.querySelectorAll('.op').forEach((o) => { o.classList.add('off'); o.disabled = true; });
      b.classList.remove('off'); b.classList.add('sel');
      await fb.set(fb.ref(fb.db, `salas/${sala}/respostas/${e.q}/${id}`), { op, ms, nome });
      setTimeout(() => jaRespondeu(e.q, op), 550);
    };
  });
}

function jaRespondeu(q, op) {
  const letra = op === undefined ? '' : ` na alternativa <b>${'ABCD'[op]}</b>`;
  render(`<div class="aguardando"><p class="eyebrow">Questão ${q + 1}</p>
    <h1 class="big">Resposta enviada${letra ? '' : ''}</h1>
    <p class="sub">Você respondeu${letra}. Aguarde o resultado no projetor.</p>
    <div class="dots"><i></i><i></i><i></i></div></div>
    ${Object.keys(jogadores).length > 1 ? listaRank(3) : ''}`);
}

function verResposta(e) {
  const q = QUESTOES[e.q];
  if (!q) return;
  const minha = (e.minhas && e.minhas[id]) || null;
  const acertou = minha && minha.op === q.c;
  const ganhou = minha ? pontos(acertou, minha.ms) : 0;
  render(`<div class="card ${acertou ? 'ok' : 'nao'}">
      <p class="eyebrow" style="color:${acertou ? 'var(--green)' : 'var(--red)'}">
        ${minha ? (acertou ? 'Você acertou' : 'Não foi dessa vez') : 'Você não respondeu'}</p>
      ${acertou ? `<p class="ganho">+${ganhou}</p>` : ''}
      <h3>Resposta certa: ${'ABCD'[q.c]} — ${esc(q.o[q.c])}</h3>
      <p>${esc(q.why)}</p></div>
    <div><p class="eyebrow" style="margin-bottom:10px">Ranking parcial</p>${listaRank(5)}</div>`);
  respondida = -1;
}

function verFim() {
  const arr = ordenado();
  const eu = arr.findIndex((x) => x.id === id) + 1;
  render(`<div><p class="eyebrow">Fim do quiz</p>
    <h1 class="big">${eu && eu <= 3 ? 'Você está no pódio!' : 'Obrigado por participar'}</h1>
    ${eu ? `<p class="sub" style="margin-top:8px">Você terminou em <b>${eu}º lugar</b> com <b>${meusPontos} pontos</b>.</p>` : ''}</div>
    ${listaRank(5)}`);
}
</script>
</body>
</html>
